services:
  postgres:
    image: postgres:16-alpine
    container_name: eap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-eap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eap_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-eap}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-eap}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: eap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: eap-backend
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  mcp-postgres:
    build:
      context: ./mcp/postgres
    container_name: eap-mcp-postgres
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9101:9101"

  mcp-gmail:
    build:
      context: ./mcp/gmail
    container_name: eap-mcp-gmail
    restart: unless-stopped
    env_file: .env
    ports:
      - "9102:9102"

  mcp-drive:
    build:
      context: ./mcp/drive
    container_name: eap-mcp-drive
    restart: unless-stopped
    env_file: .env
    ports:
      - "9103:9103"

  frontend:
    build:
      context: ./frontend
    container_name: eap-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
